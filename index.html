<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Libertà – V1</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#17202a;
}

header{
  background:#111827;
  color:white;
  padding:24px 18px;
}

header h1{
  margin:0 0 6px;
  font-size:28px;
}

header p{
  margin:0;
  color:#cbd5e1;
}

main{
  max-width:700px;
  margin:auto;
  padding:18px;
}

.card{
  background:white;
  border-radius:16px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.status{
  display:grid;
  gap:10px;
}

.status div{
  padding:12px;
  background:#f1f5f9;
  border-radius:10px;
}

.chat{
  height:400px;
  overflow-y:auto;
  background:#eef2f7;
  border-radius:12px;
  padding:12px;
  margin-bottom:12px;
}

.msg{
  max-width:85%;
  padding:11px 13px;
  margin:8px 0;
  border-radius:13px;
  white-space:pre-wrap;
}

.msg.user{
  margin-left:auto;
  background:#2563eb;
  color:white;
}

.msg.ai{
  background:white;
  border:1px solid #dbe2ea;
}

.row{
  display:flex;
  gap:8px;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #cbd5e1;
  border-radius:10px;
  font-size:16px;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 16px;
  background:#2563eb;
  color:white;
  font-size:15px;
  cursor:pointer;
}

button.danger{
  background:#dc2626;
}

.memory{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#f1f5f9;
  padding:10px;
  margin-top:8px;
  border-radius:10px;
}

.small{
  color:#64748b;
  font-size:14px;
  line-height:1.5;
}
</style>
</head>
